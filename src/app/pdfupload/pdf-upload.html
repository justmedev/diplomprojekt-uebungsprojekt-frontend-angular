<div class="upload-container">
  <p-toast></p-toast>

  <p-card header="Upload PDF Document">
    @if (!selectedFile()) {
      <div
        class="dropzone"
        [class.drag-over]="isDragging()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        (click)="fileInput.click()"
      >
        <input
          #fileInput
          type="file"
          accept="application/pdf"
          (click)="$event.target.value = ''"
          (change)="onFileSelect($event)"
          hidden
        />
        <i class="pi pi-cloud-upload upload-icon"></i>
        <p class="upload-title">Drag & drop PDF here or click to browse</p>
        <span class="hint">Note: Only PDF files are supported</span>
      </div>
    } @else {
      <div class="file-preview">
        <div class="file-info">
          <i class="pi pi-file-pdf pdf-icon"></i>
          <div>
            <p class="file-name">{{ selectedFile()?.name }}</p>
            <p class="file-size">
              {{ ((selectedFile()?.size ?? 0) / (1024 * 1024)).toFixed(2) }} MB
            </p>
          </div>
        </div>

        <div class="actions">
          <p-button
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            [text]="true"
            [disabled]="isUploading()"
            (onClick)="reset()"
          />
          <p-button
            label="Upload"
            icon="pi pi-upload"
            [loading]="isUploading()"
            (onClick)="upload()"
          />
        </div>
      </div>
    }
  </p-card>
</div>
